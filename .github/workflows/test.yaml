name: Test

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - test/**
      - scripts/**
      - dist/**
      - .github/workflows/test.yaml
      - package.json
      - package-lock.json
      - tsconfig.json

  pull_request:
    branches:
      - main
    paths:
      - src/**
      - test/**
      - scripts/**
      - dist/**
      - .github/workflows/test.yaml
      - package.json
      - package-lock.json
      - tsconfig.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11 AMD64
            os: windows-2025
          - name: Windows 11 ARM64
            os: windows-11-arm
          - name: MacOS 26 AMD64
            os: macos-26-intel
          - name: MacOS 26 ARM64
            os: macos-26
          - name: Ubuntu 24 AMD64
            os: ubuntu-24.04
          - name: Ubuntu 24 ARM64
            os: ubuntu-24.04-arm

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      -
        name: Install dependencies
        run: npm ci

      -
        name: Build Chalkboard
        run: npm run build

      -
        name: Run Tests
        run: npm run test
