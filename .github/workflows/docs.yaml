name: Docs

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - dist/**
      - docs/**
      - typedoc.json
      - .github/workflows/docs.yaml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      -
        name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      -
        name: Install dependencies
        run: npm --prefix docs ci

      -
        name: Build Docs
        run: npm run docs

      -
        name: Setup Pages
        uses: actions/configure-pages@v6

      -
        name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/build/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      -
        name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
